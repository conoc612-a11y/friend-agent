# PR과 main·staging 푸시마다 pytest로 동작 예시 테스트를 돌린다.
name: test

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
